services:
  - type: web
    name: trimble-inventory-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/inventory.db
      - key: RESERVATION_EXPIRY_MINUTES
        value: 15
    disk:
      name: inventory-data
      mountPath: /var/data
      sizeGB: 1
